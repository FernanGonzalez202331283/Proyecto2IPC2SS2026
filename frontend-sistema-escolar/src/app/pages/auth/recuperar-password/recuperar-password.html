<div class="row justify-content-center align-items-center vh-100">
  <div class="col-md-4">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-primary text-white text-center py-3">
        <h4 class="mb-0 fw-bold">Sistema Escolar</h4>
        <small>Cambiar / Recuperar Contraseña</small>
      </div>
      <div class="card-body p-4">

        <!-- Alerta de Éxito -->
        @if (successMessage) {
          <div class="alert alert-success d-flex align-items-center shadow-sm fw-semibold mb-3" role="alert">
            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
            <div>{{ successMessage }}</div>
          </div>
        }

        <!-- Alerta de Error -->
        @if (errorMessage) {
          <div class="alert alert-danger d-flex align-items-center shadow-sm fw-semibold mb-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <div>{{ errorMessage }}</div>
          </div>
        }

        <form [formGroup]="recuperarForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="username" class="form-label">Usuario:</label>
            <input 
              type="text" 
              class="form-control" 
              id="username" 
              formControlName="username" 
              placeholder="Ingrese su usuario">
          </div>

          <div class="mb-3">
            <label for="passwordAnterior" class="form-label">Contraseña Anterior:</label>
            <input 
              type="password" 
              class="form-control" 
              id="passwordAnterior" 
              formControlName="passwordAnterior" 
              placeholder="••••••••">
          </div>

          <div class="mb-3">
            <label for="nuevoPassword" class="form-label">Nueva Contraseña:</label>
            <input 
              type="password" 
              class="form-control" 
              id="nuevoPassword" 
              formControlName="nuevoPassword" 
              placeholder="Mínimo 4 caracteres">
          </div>

          <button type="submit" class="btn btn-primary w-100 mt-2" [disabled]="recuperarForm.invalid || procesando">
            <i class="bi bi-key-fill me-1"></i> Actualizar Contraseña
          </button>

          <div class="mt-3 text-center">
            <a routerLink="/login" class="text-decoration-none small text-secondary fw-semibold">
              <i class="bi bi-arrow-left me-1"></i> Volver al inicio de sesión
            </a>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
